# Example kit for driver.type: harness (TDM-33 [4.1]). Validate with: anybench kit validate packages/kit/examples/harness
schema_version: 2

subject:
  kind: harness
  name: tandem
  summary: A shared task board that coordinates a planner and N Claude Code workers with approvals.
  better_means:
    - more hidden tests pass
    - finishes faster with more workers
    - fewer merge conflicts

contenders:
  - id: tandem
    role: subject
    # Comparable setups (plan.md 17.2 rule 4): a pinned ref, model and CLI version, and the same
    # caps as the baseline.
    source: { github: jaximus808/tandem, ref: v0.1.0 }
    driver:
      type: harness
      verbs:
        run: adapters/tandem/driver.sh run {task} {workspace}
      wall_clock_cap_s: 3600
      model: claude-sonnet-4-5-20250929
      token_cap_tokens: 5000000
      max_turns: 200
    version: tandem@v0.1.0
    versions: { CLAUDE_CODE_VERSION: "2.0.14" }
  - id: claude-code
    name: plain Claude Code
    role: baseline
    source:
      upload: [baselines/claude-code/CLAUDE.md]
    driver:
      type: coding-agent
      verbs:
        run: adapters/claude-code/driver.sh run {task} {workspace}
      wall_clock_cap_s: 3600
      model: claude-sonnet-4-5-20250929
      token_cap_tokens: 5000000
      max_turns: 200
    versions: { CLAUDE_CODE_VERSION: "2.0.14" }
    found_by: "researcher: the plain default"

workloads:
  - id: todo-api
    title: Build a small TODO HTTP API with tests
    instruction: workloads/todo-api/instruction.md
    setup: workloads/todo-api/setup.sh
  - id: bug-hunt
    title: Fix three planted bugs in a date library
    instruction: workloads/bug-hunt/instruction.md

collectors: [machine, time, stream-json, proxy-calls, tandem-board]

gates:
  - id: hidden-tests
    kind: hidden-tests
    reference: gates/hidden-tests/tests/
    timeout_s: 900

requirements:
  - id: tests-pass
    type: measured
    title: Hidden tests pass
    metric: tests_passed_ratio
    better: higher
    gate_id: hidden-tests
  - id: wall
    type: measured
    title: Wall-clock time to finish
    metric: wall_s
    unit: s
    better: lower
    gate_id: hidden-tests
  - id: cost
    type: measured
    title: Cost per task
    metric: cost_micro_usd
    unit: micro-USD
    better: lower
    gate_id: hidden-tests
  - id: quality
    type: reviewed
    title: Code quality against the rubric
    criterion: Code quality
    gate_id: hidden-tests

proof:
  oracle:
    id: reference-solution
    dir: proof/oracle/
    gates: [hidden-tests]
    description: Copies the reference solution into EVAL_WS; must pass every hidden test.
  do_less:
    - id: noop-harness
      dir: proof/do_less/noop/
      contender: tandem
      driver_patch: proof/do_less/noop/driver.patch
      description: No-op harness; must fail hidden tests and show 0 claims.
  regression:
    id: one-worker
    dir: proof/regression/
    contender: tandem
    env: { WORKERS: "1" }
    description: One worker instead of three; must score lower on wall time.

vary:
  WORKERS: [1, 3]
# Approvals are automatic: an llm-reviewer would be an assist only Tandem gets, unless every
# contender declared it in assists[].
human_in_loop: { kind: tandem, policy: auto }
secrets: [ANTHROPIC_API_KEY]
collect: ["*.jsonl", "tandem/"]
transfer: { max_mb: 200 }

scoring:
  weights: { tests-pass: 50, wall: 15, cost: 15, quality: 20 }
repeats: 3
schedule: { order_seed: 1 }

env:
  profile: agent-cc
  resources: { vcpu: 4, memory_gb: 8, disk_gb: 20 }
  toolchains: [{ name: node, version: "22" }]
  network: { allow: [api.anthropic.com, registry.npmjs.org] }
