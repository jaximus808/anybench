schema_version: 2
subject:
  kind: software
  name: tool
  summary: A tiny CLI used by the broken-kit fixtures.
  better_means: [faster]
contenders:
  - id: tool
    role: subject
    source: { github: example/tool, ref: v1.0.0 }
    driver:
      type: cli
      verbs: { run: "adapters/tool/driver.sh run {in} {out}" }
workloads:
  - id: small
  - id: large
    title: Declared but never written
gates:
  - id: same-output
    kind: output-diff
requirements:
  - id: wall
    type: measured
    title: Wall time
    metric: wall_s
    better: lower
    gate_id: same-output
proof:
  oracle: { id: reference, dir: proof/oracle/ }
scoring:
  weights: { wall: 100 }
repeats: 3
