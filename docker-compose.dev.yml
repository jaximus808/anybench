# Local Postgres for offline dev and tests (TDM-11). Prod and the Neon dev branch do not use this.
# Host port is 55432 because 5432 is often taken by another local Postgres.
# Matching URL: LOCAL_DATABASE_URL=postgres://anybench:anybench@localhost:55432/anybench
name: anybench-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: anybench
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anybench}
      POSTGRES_DB: anybench
    ports:
      - "${ANYBENCH_PG_PORT:-55432}:5432"
    volumes:
      - anybench-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anybench -d anybench"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  anybench-pg:
