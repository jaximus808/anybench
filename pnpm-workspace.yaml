packages:
  - "apps/*"
  - "packages/*"
  # TDM-21 Stripe spike (setup script reused by 10.2); a package so it can import the stripe SDK.
  - "scripts/spikes/stripe"
  # TDM-154 deploy scripts (pnpm tsx scripts/deploy/api.ts); a package so it can import server + naive.
  - "scripts/deploy"

# pnpm 11 blocks dependency build scripts unless listed here.
# esbuild (tsx, vite/vitest, drizzle-kit) needs its postinstall; ssh2/cpu-features
# only build optional native speedups, so they stay off.
allowBuilds:
  cpu-features: false
  esbuild: true
  ssh2: false

# pnpm 11 refuses versions younger than its minimum release age; these were
# allowed explicitly when the scaffold (TDM-6) pinned them.
minimumReleaseAgeExclude:
  - "@usenaive-sdk/managed-agents@0.12.3"
  - hono@4.13.17
