<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Anybench mark (components/site/Mark.tsx): a 3×3 trial grid, seven passed, one failed
       its gate, one still running in orange. Fixed colours: a favicon can't read CSS variables. -->
  <rect width="32" height="32" rx="7" fill="#0a0c09"/>
  <g fill="#eceee4">
    <rect x="5" y="5" width="6" height="6" rx="1"/>
    <rect x="13" y="5" width="6" height="6" rx="1"/>
    <rect x="5" y="13" width="6" height="6" rx="1"/>
    <rect x="21" y="13" width="6" height="6" rx="1"/>
    <rect x="5" y="21" width="6" height="6" rx="1"/>
    <rect x="13" y="21" width="6" height="6" rx="1"/>
    <rect x="21" y="21" width="6" height="6" rx="1"/>
  </g>
  <rect x="21" y="5" width="6" height="6" rx="1" fill="#4a5143"/>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="#ff7a1a"/>
</svg>
